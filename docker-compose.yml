services:
  ecu-system:
    build: .
    container_name: ecu_monitor_live_legacy
    ports:
      - "8001:8000"
    environment:
      - ECU_MODE=STRICT 
      - TEMP_THRESHOLDS=110.0
      - ECU_MODE=BROKEN
      - ECU_MODE=SiMULATION
    volumes:
      - ./jenkins_artifacts:/app/output
      - ./data:/app/data